  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    /* The brand's mark while the app loads (server.mjs brandAppShell adds it) */
    #boot-mark { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(241, 240, 246, .42); pointer-events: none; animation: boot-in .4s .3s both; }
    #boot-mark svg { width: 72px; height: auto; }
    @keyframes boot-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #boot-mark { animation: none; } }
    /* A branded (desktop) page loads on the light desktop's color for light-mode systems */
    @media (prefers-color-scheme: light) {
      html:has(#boot-mark), html:has(#boot-mark) body { background: #eef0ff; }
      #boot-mark { color: rgba(29, 27, 38, .38); }
    }
    #shiro-layout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
    }
    #terminal {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: calc(100% - clamp(0px, calc(100vh - 20em), 1em));
      padding: 4px;
    }
    /* Split pane */
    #split-pane {
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
    }
    .split-right #split-pane { width: 50%; border-left: 2px solid #3d3d5c; }
    .split-bottom { flex-direction: column !important; }
    .split-bottom #split-pane { height: 50%; border-top: 2px solid #3d3d5c; }
    #split-pane .split-titlebar {
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: #2a2a3e;
      flex-shrink: 0;
    }
    #split-pane .split-close {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ff5f57;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    #split-pane .split-close:hover { background: #ff3b30; }
    #split-pane .split-title {
      font-size: 0.75rem;
      font-family: 'SF Mono', Consolas, monospace;
      color: #888;
      margin-left: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #split-pane iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
    .become-active #split-pane { display: none !important; }
    .xterm { height: 100%; }
    /* Scrollbar styling - make it visible and match terminal theme */
    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 10px;
      background: #1a1a2e;
    }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 5px;
    }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
    /* Remove underline decoration from xterm.js OSC 8 links */
    .xterm .xterm-screen .xterm-decoration-container .xterm-decoration {
      text-decoration: none !important;
      border-bottom: none !important;
    }
    /* Alternative: target the link layer directly */
    .xterm-link-layer {
      text-decoration: none !important;
    }
    /* iOS: prevent auto-zoom on input focus (requires font-size >= 16px) */
    .xterm-helper-textarea {
      font-size: 16px !important;
    }
    /* Unified mobile toolbar (virtual keys + actions, 2 rows) */
    #shiro-vkeys {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #2a2a3e;
      border-top: 1px solid #3d3d5c;
      z-index: 2147483647;
      padding: 3px 4px;
    }
    @media (pointer: coarse) {
      #shiro-vkeys { display: block; }
    }
    .vkey-row {
      display: flex;
      gap: 3px;
      align-items: center;
      height: 34px;
    }
    .vkey-row + .vkey-row { margin-top: 2px; }
    .shiro-vkey {
      flex-shrink: 0;
      min-width: 36px;
      height: 30px;
      background: #3d3d5c;
      color: #e0e0e0;
      border: none;
      border-radius: 5px;
      font-family: monospace;
      font-size: 13px;
      padding: 0 5px;
      letter-spacing: -0.5px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .shiro-vkey:active { background: #5a5a7a; }
    .shiro-vkey.mod { font-size: 11px; }
    .shiro-vkey.active { background: #0a84ff; color: #fff; }
    .shiro-vkey.action { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; }
    .shiro-vkey.dictating { background: #ff3b30; color: #fff; animation: mic-pulse 1.5s ease-in-out infinite; }
    .vkey-spacer { flex: 1; }
    @keyframes mic-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    /* Become mode: full-screen app, terminal hidden */
    #become-container {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      background: #000;
    }
    #become-container iframe {
      width: 100%; height: 100%; border: none;
    }
    .become-active #terminal,
    .become-active #shiro-vkeys { display: none !important; }
