  // --- Zorb-Inspired Compact Responsive Layout Solver (Portrait/Narrow & Landscape, Zero Scroll!) ---
  const scr = document.getElementById("screen");
  const padL = document.getElementById("padL");
  const padR = document.getElementById("padR");
  const q = (sel) => document.querySelector(sel);
  const place = (el, cx, cy, w, h) => {
    if (!el) return;
    const s = el.style;
    s.left = Math.round(cx - w / 2) + "px";
    s.top = Math.round(cy - h / 2) + "px";
    s.width = Math.round(w) + "px";
    s.height = Math.round(h) + "px";
  };

  function solve() {
    const vv = window.visualViewport;
    const W = Math.round(vv ? vv.width : window.innerWidth);
    const H = Math.round(vv ? vv.height : window.innerHeight);
    // Zorb-style adaptive bottom controller mode whenever window is narrow or portrait (`W < 920 || H >= W * 0.82`)
    const port = W < 920 || H >= W * 0.82;
    const AR = 144 / 90;
    const pad = 6;
    const topBarH = 32;

    let sx, sy, sw, sh, lCx, rCx, cy, span;
    let socialTop = 0;
    let socialH = 0;

    if (isFullscreenMode) {
      sx = 0;
      sy = 0;
      sw = W;
      sh = H;
      socialH = 74;
      socialTop = H - socialH - 6;
      span = Math.min(148, Math.max(108, Math.min(W, H) * 0.22));
      const fsBtnSz = Math.max(32, Math.min(44, span * 0.29));
      const fsR = Math.max(fsBtnSz * 0.90, span * 0.34);
      const fsPh = Math.max(20, fsBtnSz * 0.44);
      const bottomReach = fsR + fsBtnSz * 0.56 + fsPh * 1.06;
      const isPortraitFs = H >= W * 0.85;
      if (isPortraitFs) {
        // Portrait fullscreen: place control pads cleanly above the bottom chat controls (`socialTop`)!
        cy = Math.max(topBarH + bottomReach + 12, socialTop - bottomReach - 10);
        lCx = Math.max(span * 0.68 + 14, W * 0.24);
        rCx = Math.min(W - span * 0.68 - 14, W * 0.76);
      } else {
        // Landscape fullscreen: place control pads in left/right wings moved up slightly, and keep above `socialTop` if narrow!
        lCx = span * 0.68 + 14;
        rCx = W - span * 0.68 - 14;
        const padInnerEdge = lCx + fsR + fsBtnSz * 0.65;
        const socHalfW = Math.min(520, W - 24) * 0.5;
        if (W * 0.5 - socHalfW < padInnerEdge + 8) {
          cy = Math.max(topBarH + bottomReach + 8, socialTop - bottomReach - 8);
        } else {
          cy = Math.min(H - bottomReach - 22, socialTop - fsPh - 8);
        }
      }
    } else if (port) {
      // Single compact top row (`topBarH = 32px`), then #screen immediately below (`sy = topBarH + 2`),
      // then #social-tui-canvas directly below #screen, and controller pads at bottom!
      const usableH = Math.max(240, H - topBarH);
      socialH = Math.max(68, Math.min(92, Math.round(usableH * 0.14)));
      const maxScreenH = Math.round(usableH * 0.48);
      sw = Math.min(W - pad * 2, maxScreenH * AR);
      sh = Math.round(sw / AR);
      sx = Math.round((W - sw) / 2);
      sy = topBarH + 2;

      socialTop = sy + sh + 4;
      const botTop = socialTop + socialH + 4;
      const botH = Math.max(112, H - botTop - pad);
      span = Math.min(W * 0.46, botH * 0.88, 216);
      cy = botTop + botH * 0.48;
      lCx = Math.max(span * 0.52 + pad, W * 0.25);
      rCx = Math.min(W - span * 0.52 - pad, W * 0.75);
    } else {
      const sideMin = Math.max(145, Math.min(228, W * 0.22));
      const availW = W - sideMin * 2 - pad * 4;
      socialH = Math.max(82, Math.min(112, Math.round(H * 0.17)));
      const availH = Math.max(170, H - topBarH - socialH - pad * 3);
      sh = Math.round(Math.min(availH, availW / AR));
      sw = Math.round(sh * AR);
      sx = Math.round((W - sw) / 2);
      sy = topBarH + Math.max(2, Math.round((availH - sh) / 2));
      socialTop = sy + sh + 4;

      const wing = sx - pad;
      const totalCenterH = H - topBarH - pad * 2;
      span = Math.min(wing * 0.92, totalCenterH * 0.68, 220);
      cy = topBarH + totalCenterH * 0.52;
      lCx = wing / 2 + pad / 2;
      rCx = W - wing / 2 - pad / 2;
    }

    scr.style.left = Math.round(sx) + "px";
    scr.style.top = Math.round(sy) + "px";
    scr.style.width = Math.round(sw) + "px";
    scr.style.height = Math.round(sh) + "px";

    // Update `window.SlopesViewport` so `#pi-shift` dynamically sizes its window for the display's exact aspect ratio
    // in fullscreen mode without stretching pixels!
    const baseW = 1008;
    const baseH = 630;
    let viewW = baseW;
    let viewH = baseH;
    let offsetX = 0;
    let offsetY = 0;
    if (isFullscreenMode && sw > 0 && sh > 0) {
      const dispAR = sw / sh;
      const baseAR = baseW / baseH;
      if (dispAR < baseAR - 0.01) {
        // Tall / portrait fullscreen: keep full 1008 world width and extend vertical window height
        viewW = baseW;
        viewH = Math.max(baseH, Math.round(baseW / dispAR));
        offsetX = 0;
        offsetY = Math.round((viewH - baseH) * 0.38);
      } else if (dispAR > baseAR + 0.01) {
        // Wide / landscape fullscreen: keep full 630 world height and extend horizontal window width
        viewH = baseH;
        viewW = Math.max(baseW, Math.round(baseH * dispAR));
        offsetX = Math.round((viewW - baseW) * 0.5);
        offsetY = 0;
      }
    }
    window.SlopesViewport = {
      isFullscreen: isFullscreenMode,
      baseW,
      baseH,
      viewW,
      viewH,
      offsetX,
      offsetY,
      sw: Math.round(sw),
      sh: Math.round(sh),
    };
    const piCanvas = document.getElementById("pi-shift");
    if (piCanvas && (piCanvas.width !== viewW || piCanvas.height !== viewH)) {
      piCanvas.width = viewW;
      piCanvas.height = viewH;
      const piCtx = piCanvas.getContext("2d");
      if (piCtx) piCtx.imageSmoothingEnabled = false;
      if (window.SlopesGame && typeof window.SlopesGame.render === "function") {
        window.SlopesGame.render();
      }
    }

    const isExpandedBottom = !isFullscreenMode && (socialState.bottomMode === "chat" || socialState.bottomMode === "terminal");

    if (padL) padL.style.display = isExpandedBottom ? "none" : "block";
    if (padR) padR.style.display = isExpandedBottom ? "none" : "block";
    if (shellCanvas) shellCanvas.style.display = (isFullscreenMode || isExpandedBottom) ? "none" : "block";

    // Position #social-tui-canvas directly below #screen!
    // - In `chat` or `terminal` focus mode: expands edge-to-edge (`0..W`) from right below `#screen` (`sy + sh + 2`)
    //   all the way to the very last pixel of the viewport (`H`) with zero reflow of top header or `#screen`.
    // - In `controller` mode on portrait (`port`): spans edge-to-edge (`0..W`) between `#screen` and controller pads.
    if (socialCanvas) {
      if (isExpandedBottom) {
        const expTop = Math.round(sy + sh + 2);
        const expH = Math.max(120, H - expTop);
        socialCanvas.style.left = "0px";
        socialCanvas.style.top = expTop + "px";
        socialCanvas.style.width = W + "px";
        socialCanvas.style.height = expH + "px";
      } else if (port && !isFullscreenMode) {
        socialCanvas.style.left = "0px";
        socialCanvas.style.top = Math.round(sy + sh + 3) + "px";
        socialCanvas.style.width = W + "px";
        socialCanvas.style.height = Math.round(socialH) + "px";
      } else {
        const isPortraitFs = H >= W * 0.85;
        const wingPad = isFullscreenMode && !isPortraitFs ? Math.round((lCx + span * 0.56 + 14) * 2) : 24;
        const socW = isFullscreenMode ? Math.min(520, Math.max(320, W - wingPad)) : Math.round(sw);
        const socLeft = isFullscreenMode ? Math.round((W - socW) / 2) : Math.round(sx);
        socialCanvas.style.left = socLeft + "px";
        socialCanvas.style.top = Math.round(socialTop) + "px";
        socialCanvas.style.width = socW + "px";
        socialCanvas.style.height = Math.round(socialH) + "px";
      }
      renderSocialTuiCanvas();
    }

    const btn = isFullscreenMode ? Math.max(32, Math.min(44, span * 0.29)) : Math.max(38, Math.min(64, span * 0.32));
    const R = Math.max(btn * 0.90, span * 0.34);

    // D-pad
    place(q('[data-k="u"]'), lCx, cy - R, btn, btn);
    place(q('[data-k="d"]'), lCx, cy + R, btn, btn);
    place(q('[data-k="l"]'), lCx - R, cy, btn, btn);
    place(q('[data-k="r"]'), lCx + R, cy, btn, btn);

    // Action buttons
    place(q('[data-k="tri"]'), rCx, cy - R, btn, btn);
    place(q('[data-k="cir"]'), rCx + R, cy, btn, btn);
    place(q('[data-k="crs"]'), rCx, cy + R, btn, btn);
    place(q('[data-k="sqr"]'), rCx - R, cy, btn, btn);

    // SELECT / START / ZOOM pills + Top Shoulder ROT L / TAB-FORM / ROT R / DAT-307 pills
    const pw = Math.max(60, btn * 1.18);
    const ph = Math.max(20, btn * 0.44);
    const pillsOverlapChatX = isFullscreenMode && (lCx + pw * 1.05 >= (W - Math.min(520, Math.max(320, W - 24))) * 0.5);
    const maxPy = (isFullscreenMode && (H >= W * 0.85 || pillsOverlapChatX)) ? socialTop - ph / 2 - 8 : H - ph / 2 - 6;
    const py = Math.min(maxPy, cy + R + btn * 0.56 + ph * 0.56);
    place(q('[data-k="sel"]'), lCx - pw * 0.52, py, pw, ph);
    place(q('[data-k="zoomOut"]'), lCx + pw * 0.52, py, pw, ph);
    place(q('[data-k="sta"]'), rCx - pw * 0.52, py, pw, ph);
    place(q('[data-k="zoomIn"]'), rCx + pw * 0.52, py, pw, ph);

    const topPy = Math.max(topBarH + ph / 2 + 4, cy - R - btn * 0.56 - ph * 0.56);
    const shW = Math.max(56, btn * 1.12);
    place(q('[data-k="rotL"]'), lCx - shW * 0.52, topPy, shW, ph);
    place(q('[data-k="tabform"]'), lCx + shW * 0.52, topPy, shW, ph);
    place(q('[data-k="rotR"]'), rCx - shW * 0.52, topPy, shW, ph);
    place(q('[data-k="dat"]'), rCx + shW * 0.52, topPy, shW, ph);

    // Top row layout:
    // - On mobile / portrait (`port === true`): compact Volume (#osd on left), Fullscreen (#fullscreen-btn in center),
    //   and Minimap (#minimap-canvas on right) onto ONE single shared 26px top row (`top = 4px`)!
    // - On desktop / landscape (`!port`): Volume (#osd) and Fullscreen (#fullscreen-btn) on top row (`top = 4px`),
    //   and Minimap (#minimap-canvas) at top-left outside #screen above the left controller buttons!
    if (port) {
      const rowTop = 4;
      const rowH = 26;
      const gap = 4;
      const availRowW = Math.max(260, W - 12);
      const osdW = Math.max(96, Math.min(132, Math.floor(availRowW * 0.35)));
      const fsW = Math.max(72, Math.min(98, Math.floor(availRowW * 0.25)));
      const mmW = Math.max(84, availRowW - osdW - fsW - gap * 2);

      const osdLeft = 6;
      const fsLeft = osdLeft + osdW + gap;
      const mmLeft = fsLeft + fsW + gap;

      if (osdCanvas) {
        osdCanvas.style.left = osdLeft + "px";
        osdCanvas.style.right = "auto";
        osdCanvas.style.top = rowTop + "px";
        osdCanvas.style.width = osdW + "px";
        osdCanvas.style.height = rowH + "px";
      }
      if (fsBtn) {
        fsBtn.style.left = fsLeft + "px";
        fsBtn.style.top = rowTop + "px";
        fsBtn.style.width = fsW + "px";
        fsBtn.style.height = rowH + "px";
      }
      if (minimapCanvas) {
        minimapCanvas.style.left = mmLeft + "px";
        minimapCanvas.style.top = rowTop + "px";
        minimapCanvas.style.width = mmW + "px";
        minimapCanvas.style.height = rowH + "px";
      }
    } else {
      if (osdCanvas) {
        osdCanvas.style.left = "auto";
        osdCanvas.style.right = "8px";
        osdCanvas.style.top = "4px";
        osdCanvas.style.width = "144px";
        osdCanvas.style.height = "26px";
      }
      if (fsBtn) {
        const fsW = 104;
        const fsH = 24;
        fsBtn.style.width = fsW + "px";
        fsBtn.style.height = fsH + "px";
        if (isFullscreenMode) {
          fsBtn.style.left = Math.max(8, W - fsW - 160) + "px";
          fsBtn.style.top = "5px";
        } else {
          const fsLeft = Math.min(W - fsW - 158, Math.max(8, Math.round(sx + sw - fsW)));
          fsBtn.style.left = fsLeft + "px";
          fsBtn.style.top = "5px";
        }
      }
      if (minimapCanvas) {
        const leftBtnsTopY = Math.round(topPy - ph / 2);
        if (isFullscreenMode) {
          minimapCanvas.style.left = "8px";
          minimapCanvas.style.top = "34px";
          minimapCanvas.style.width = "136px";
          minimapCanvas.style.height = "72px";
        } else {
          const wingW = Math.max(96, Math.round(sx - 12));
          const mmW = Math.max(104, Math.min(176, wingW));
          const availTopH = Math.max(42, leftBtnsTopY - 12);
          const mmH = Math.max(44, Math.min(108, availTopH, Math.round(mmW * 0.62)));
          const mmLeft = Math.max(6, Math.min(Math.round(sx - mmW - 6), Math.round(lCx - mmW / 2)));
          const mmTop = Math.max(6, Math.min(Math.round(sy), Math.round(leftBtnsTopY - mmH - 6)));
          minimapCanvas.style.left = mmLeft + "px";
          minimapCanvas.style.top = mmTop + "px";
          minimapCanvas.style.width = mmW + "px";
          minimapCanvas.style.height = mmH + "px";
        }
      }
    }

    renderFullscreenBtn();
    renderMinimapCanvas();
    lastLayout = { W, H, port, lCx, rCx, cy, R, btn };
    drawBackdrop(W, H);
    if (!isFullscreenMode && !isExpandedBottom) drawShell(lastLayout);
    renderAllButtons();
    renderHudBar();
    renderOsd();
    renderDialog();
  }

  window.addEventListener("resize", solve);
  window.addEventListener("orientationchange", () => setTimeout(solve, 60));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", solve);
  solve();

  // --- Multi-Touch Pointer Input + Auto-Repeat for D-Pad ---
  const repeatTimers = new Map();

  function triggerKey(k, down) {
    if (down) pressedButtons.add(k);
    else pressedButtons.delete(k);

    const el = document.querySelector(`[data-k="${k}"]`);
    if (el) renderButtonCanvas(el);

    if (!down) {
      if (repeatTimers.has(k)) {
        clearInterval(repeatTimers.get(k));
        repeatTimers.delete(k);
      }
      return;
    }

    if (window.SlopesAudio) window.SlopesAudio.unlock();

    if (k === "tabform" && lastLayout && lastLayout.port && !isFullscreenMode) {
      setBottomMode(socialState.bottomMode === "terminal" ? "controller" : "terminal");
      return;
    }

    if (k === "dat") {
      if (window.SlopesDatPuter && typeof window.SlopesDatPuter.toggle === "function") {
        window.SlopesDatPuter.toggle();
      }
      return;
    }

    if (k === "sta") {
      if (window.SlopesAudio) window.SlopesAudio.playClick(true);
      const opening = !dlg.classList.contains("open");
      dlg.classList.toggle("open", opening);
      if (opening) renderDialog();
      if (window.SlopesGame) window.SlopesGame.setPaused(opening);
      return;
    }

    if (window.SlopesGame) {
      window.SlopesGame.action(k);
    }

    if ((k === "l" || k === "r" || k === "u" || k === "d") && !repeatTimers.has(k)) {
      const iv = setInterval(() => {
        if (window.SlopesGame) window.SlopesGame.action(k);
      }, 95);
      repeatTimers.set(k, iv);
    }
  }

  const activePointers = new Map();
  const hitButton = (x, y) => {
    const el = document.elementFromPoint(x, y);
    return el && el.dataset && el.dataset.k ? el.dataset.k : null;
  };

  function syncButtons(prevSet) {
    const nextSet = new Set(activePointers.values());
    prevSet.forEach((k) => { if (k && !nextSet.has(k)) triggerKey(k, false); });
    nextSet.forEach((k) => { if (k && !prevSet.has(k)) triggerKey(k, true); });
  }

  [padL, padR].forEach((pad) => {
    pad.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (e.pointerType === "touch" && !isTouchMode) {
        isTouchMode = true;
        renderAllButtons();
      }
      if (window.SlopesAudio) window.SlopesAudio.unlock();
      const k = e.target.closest("[data-k]")?.dataset.k;
      if (!k) return;
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      const prev = new Set(activePointers.values());
      activePointers.set(e.pointerId, k);
      syncButtons(prev);
    });
    pad.addEventListener("pointermove", (e) => {
      if (!activePointers.has(e.pointerId)) return;
      const k = hitButton(e.clientX, e.clientY);
      if (k !== activePointers.get(e.pointerId)) {
        const prev = new Set(activePointers.values());
        activePointers.set(e.pointerId, k);
        syncButtons(prev);
      }
    });
    const endPointer = (e) => {
      if (!activePointers.has(e.pointerId)) return;
      const prev = new Set(activePointers.values());
      activePointers.delete(e.pointerId);
      syncButtons(prev);
    };
    pad.addEventListener("pointerup", endPointer);
    pad.addEventListener("pointercancel", endPointer);
  });

  scr.addEventListener("pointerdown", () => {
    blurChatInput();
    if (window.SlopesAudio) window.SlopesAudio.unlock();
  });

  // --- Desktop Keyboard Mapping ---
  // Note: `KeyF` (Tab-Form Terminal), `Backquote` (TE-307 Mainframe TUI), and `KeyB`/`KeyP` (DAT-307 Codex)
  // are handled directly by `tabform_lifeforms.js` and `lore_portal_dock.js` to avoid double-toggling.
  const KEY_MAP = {
    ArrowUp: "u", KeyW: "u",
    ArrowDown: "d", KeyS: "d",
    ArrowLeft: "l", KeyA: "l",
    ArrowRight: "r", KeyD: "r",
    Space: "crs", KeyK: "crs",
    KeyX: "cir", KeyL: "cir",
    KeyC: "conduit", KeyI: "tri",
    KeyZ: "sqr", KeyJ: "sqr",
    KeyQ: "rotL", BracketLeft: "rotL",
    KeyR: "rotR", BracketRight: "rotR",
    KeyT: "time",
    KeyE: "portal",
    KeyV: "craft",
    KeyG: "wasm",
    KeyY: "slice",
    Minus: "zoomOut",
    Equal: "zoomIn",
    ShiftLeft: "sel", ShiftRight: "sel", Tab: "sel",
    Enter: "sta", Escape: "sta",
  };
  const heldKeys = new Set();
  window.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if (window.SlopesTabForms && window.SlopesTabForms.state && (window.SlopesTabForms.state.terminalOpen || window.SlopesTabForms.state.monolithChatOpen)) return;
    if (window.SlopesDatPuter && window.SlopesDatPuter.state && window.SlopesDatPuter.state.open) return;
    if (isTouchMode) {
      isTouchMode = false;
      renderAllButtons();
    }
    const k = KEY_MAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (heldKeys.has(k)) return;
    heldKeys.add(k);
    triggerKey(k, true);
  });
  window.addEventListener("keyup", (e) => {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if (window.SlopesTabForms && window.SlopesTabForms.state && (window.SlopesTabForms.state.terminalOpen || window.SlopesTabForms.state.monolithChatOpen)) return;
    if (window.SlopesDatPuter && window.SlopesDatPuter.state && window.SlopesDatPuter.state.open) return;
    const k = KEY_MAP[e.code];
    if (!k) return;
    e.preventDefault();
    heldKeys.delete(k);
    triggerKey(k, false);
  });
})();
